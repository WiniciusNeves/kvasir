version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 6/7 drop moduleResolution "node" and baseUrl, which tsconfig.json and ts-node rely on:
      # moving is its own migration, not a weekly bump
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # the types follow the oldest supported Node ("engines": ">=22.13"), not the newest
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
